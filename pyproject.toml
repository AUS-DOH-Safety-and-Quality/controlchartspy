[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "pycontrolcharts"
version = "0.1.0"
description = "SPC and funnel calculations and static SVG charts using QuickJS"
readme = "README.md"
license-files = ["licenses/*", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["quickjs-ng"]

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "NOTICE", "licenses/**"]
