[build-system]
requires = ["uv_build<0.14"]
build-backend = "uv_build"

[project]
name = "controlchartspy"
version = "0.1.0"
description = "Calculate and visualise SPC, funnel, and multi-indicator sigma charts"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "licenses/*", "NOTICE"]
authors = [{ name = "Andrew Johnson", email = "andrew.johnson@arjohnsonau.com" }]
requires-python = ">=3.10"
dependencies = ["quickjs-ng"]
keywords = ["spc", "control-charts", "funnel-plots", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy#readme"
Repository = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy"
Issues = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy/issues"
Changelog = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "CHANGELOG.md"]

[tool.mypy]
files = ["src", "tools", "tests"]
mypy_path = "typings"
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pyright]
include = ["src", "tools", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = true
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingModuleSource = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
