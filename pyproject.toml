[build-system]
requires = ["uv_build<0.14"]
build-backend = "uv_build"

[project]
name = "controlchartspy"
version = "0.1.2"
description = "Calculate and visualise SPC, funnel, and multi-indicator sigma charts"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "licenses/*", "NOTICE"]
authors = [
    { name = "Andrew R. Johnson", email = "andrew.johnson@arjohnsonau.com" },
    { name = "Healthcare Quality Intelligence Unit (Western Australia Health)", email = "safetyandquality@health.wa.gov.au" },
]
requires-python = ">=3.10"
dependencies = ["quickjs-ng"]
keywords = ["spc", "control-charts", "funnel-plots", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy#readme"
Repository = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy"
Issues = "https://github.com/AUS-DOH-Safety-and-Quality/controlchartspy/issues"

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "CHANGELOG.md"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B006",
    "B008",
    "B905",
    "ISC001",
    "ISC002",
    "PGH003",
    "PGH004",
    "PYI",
    "RUF100",
    "TID251",
    "UP",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use a specific type or object."

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tools", "tests", "typings"]

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
blanket-ignore-comment = "error"
deprecated = "error"
dynamic-function-decorator-return = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
redundant-condition = "error"
redundant-condition-strict = "error"
truthiness-test-of-iterable = "error"
undefined-reveal = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
