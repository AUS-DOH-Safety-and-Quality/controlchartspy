name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx ruff==0.17.0 check .
      - run: uvx ruff==0.17.0 format --check .
      - run: uvx ty==0.0.86 check
      - run: uv run python -m unittest discover -s tests

